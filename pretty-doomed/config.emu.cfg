# PRETTY DOOMed Pipeline Configuration (Emulator Mode)
#
# Same as config.cfg but with SDR parameters configured for the IIO emulator.
# The emulator replays a sample file at its native rate (30.72 MSPS) and does
# not reflect config writes in readback attributes.
operation=doom

# Processing mode (sequential or background)
process_mode=sequential

# Signal Processing
dsp_lowpass_cutoff=3400
dsp_bandpass_low=300
dsp_bandpass_high=3400
dsp_lowpass_transition=500
dsp_bandpass_transition=100

# Speech-to-Text
stt_model_encoder=models/sherpa-onnx/small/encoder-epoch-99-avg-1.int8.onnx
stt_model_decoder=models/sherpa-onnx/small/decoder-epoch-99-avg-1.onnx
stt_model_joiner=models/sherpa-onnx/small/joiner-epoch-99-avg-1.int8.onnx
stt_model_tokens=models/sherpa-onnx/small/tokens.txt
stt_decoding_method=modified_beam_search
stt_num_threads=2
stt_concurrent_load=true

# Detection
detect_wake_word=PRETTY
detect_call_signs=NIGHT,LIGHT,HEART,POWER,HORSE,HOUSE,DARK,WORLD,COUNT,WONDER,PRINCE,FRIEND,OPEN,ALPHA,BRAVO,CHARLIE,DELTA,ECHO,FOXTROT,GOLF,HOTEL,INDIA,JULIET,KILO,LIMA,MIKE,NOVEMBER,OSCAR,PAPA,ROMEO,SIERRA,TANGO,UNIFORM,VICTOR,WHISKEY,YANKEE,ZULU
detect_command=DOOM,PLAY DOOM
detect_fuzzy_max_distance=1

# DOOM execution
doom_force_trigger=true

# Postcard generation (after DOOM execution)
doom_enable_postcard=true
doom_postcard_scale=2
doom_assets_dir=assets

# DOOM Frame Capture
doom_frames_gl-e1m2b=480-540,-1
doom_frames_gl-e1m2=646-675,2324-2353,-1
doom_frames_e1m7-607=7992-8025,8000,-1
doom_frames_impfight=-1
doom_frames_m1-fast=-1
doom_frames_m1-normal=-1
doom_frames_m1-simple=-1

# Flag indicating whether to keep frame images after GIF creation
doom_keepgifframes=false

# Demo cycling order (GIF-producing demos first for richer first-run output)
# If not set, cycles alphabetically through all .lmp files in demos/
doom_demo_order=gl-e1m2b,e1m7-607,gl-e1m2,impfight,m1-fast,m1-normal,m1-simple

# Max frame counts per demo for random frame selection.
# Values are gametic at demo end minus a margin to avoid the
# end-of-level fade-to-black and stats screen frames.
# Actual gametic values: e1m7-607=13839, gl-e1m2=5341, gl-e1m2b=5417,
#   impfight=2035, m1-fast=664, m1-normal=1836, m1-simple=787
doom_maxframes_e1m7-607=12839
doom_maxframes_gl-e1m2=5291
doom_maxframes_gl-e1m2b=5367
doom_maxframes_impfight=1985
doom_maxframes_m1-fast=564
doom_maxframes_m1-normal=1786
doom_maxframes_m1-simple=687

# SDR Capture (emulator mode)
sdr_frequency=1296000000
sdr_rate=2400000
sdr_decimation=12
sdr_rf_bandwidth=200000
sdr_gain=50
sdr_fm_deviation=5000
sdr_uri=ip:sdr-emu:30431
sdr_duration=1
sdr_max_iq_mb=20
sdr_audio_rate=16000
sdr_lpf_cutoff=85000
sdr_lpf_transition=15000
sdr_bandpass_low=300
sdr_bandpass_high=3400
sdr_min_readback=true
sdr_timeout_multiplier=60
sdr_enable_spectrogram=true
sdr_enable_constellation=true
sdr_captures=1
