# PRETTY DOOMed Pipeline Configuration
operation=doom

# Processing mode (sequential or background)
process_mode=background

# Signal Processing
dsp_lowpass_cutoff=3400
dsp_bandpass_low=300
dsp_bandpass_high=3400
dsp_lowpass_transition=500
dsp_bandpass_transition=100

# Speech-to-Text
stt_model_encoder=models/sherpa-onnx/small/encoder-epoch-99-avg-1.int8.onnx
stt_model_decoder=models/sherpa-onnx/small/decoder-epoch-99-avg-1.onnx
stt_model_joiner=models/sherpa-onnx/small/joiner-epoch-99-avg-1.int8.onnx
stt_model_tokens=models/sherpa-onnx/small/tokens.txt
stt_decoding_method=modified_beam_search
stt_num_threads=1
stt_concurrent_load=true

# Detection
detect_wake_word=PRETTY
detect_call_signs=NIGHT,LIGHT,HEART,POWER,HORSE,HOUSE,DARK,WORLD,COUNT,WONDER,PRINCE,FRIEND,OPEN,ALPHA,BRAVO,CHARLIE,DELTA,ECHO,FOXTROT,GOLF,HOTEL,INDIA,JULIET,KILO,LIMA,MIKE,NOVEMBER,OSCAR,PAPA,ROMEO,SIERRA,TANGO,UNIFORM,VICTOR,WHISKEY,YANKEE,ZULU
detect_command=DOOM,PLAY DOOM
detect_fuzzy_max_distance=1

# DOOM execution forcing (for EM testing without detection)
doom_force_trigger=false

# Postcard generation (after DOOM execution)
doom_enable_postcard=true
doom_postcard_scale=2
doom_assets_dir=assets

# DOOM Frame Capture
# Per-demo frame specs: doom_frames_<demo>=<spec>
#   Individual frame numbers produce JPEGs, dash ranges produce animated GIFs.
#   -1 = random frame each run (requires doom_maxframes_<demo>)
#   Comma-separated integers (no dashes) = cycle through across runs
doom_frames_gl-e1m2b=480-540,-1
doom_frames_gl-e1m2=646-675,2324-2353,-1
doom_frames_e1m7-607=7992-8025,8000,-1
doom_frames_impfight=-1
doom_frames_m1-fast=-1
doom_frames_m1-normal=-1
doom_frames_m1-simple=-1

# Flag indicating whether to keep frame images after GIF creation
doom_keepgifframes=false

# Demo cycling order (GIF-producing demos first for richer first-run output)
# If not set, cycles alphabetically through all .lmp files in demos/
doom_demo_order=gl-e1m2b,e1m7-607,gl-e1m2,impfight,m1-fast,m1-normal,m1-simple

# Max frame counts per demo for random frame selection.
# Values are gametic at demo end minus a margin to avoid the
# end-of-level fade-to-black and stats screen frames.
# Actual gametic values: e1m7-607=13839, gl-e1m2=5341, gl-e1m2b=5417,
#   impfight=2035, m1-fast=664, m1-normal=1836, m1-simple=787
doom_maxframes_e1m7-607=12839
doom_maxframes_gl-e1m2=5291
doom_maxframes_gl-e1m2b=5367
doom_maxframes_impfight=1985
doom_maxframes_m1-fast=564
doom_maxframes_m1-normal=1786
doom_maxframes_m1-simple=687

# SDR Capture (used with -s flag)
# RX center frequency in Hz (1296 MHz)
sdr_frequency=1296000000
# AD9361 ADC sample rate in Hz (2.4 MSPS)
sdr_rate=2400000
# Software decimation: 3x (600 kSPS / 3 = 200 kHz effective rate).
# The hardware FIR handles the first 4x (2.4 MSPS -> 600 kSPS).
# Without hardware FIR this would be 12 (2.4 MSPS / 12 = 200 kHz).
sdr_decimation=3
# AD9361 analog filter bandwidth in Hz
sdr_rf_bandwidth=200000
# RX gain in dB
sdr_gain=50
# FM deviation in Hz (narrowband voice)
sdr_fm_deviation=5000
# IIO context URI (local: for on-board AD9361)
sdr_uri=local:
# Capture duration in seconds
sdr_duration=20
# Max I/Q file size in MiB (downlink budget cap)
sdr_max_iq_mb=20
# Output audio sample rate in Hz
sdr_audio_rate=16000
# Software LPF cutoff in Hz
sdr_lpf_cutoff=85000
# Software LPF transition width in Hz
sdr_lpf_transition=15000
# Audio bandpass lower edge in Hz
sdr_bandpass_low=300
# Audio bandpass upper edge in Hz
sdr_bandpass_high=3400
# Capture timeout = duration * multiplier + 10s.
# Set to 2 with sdr_hw_fir_enable=true (captures complete in real-time).
# Set to 5 without hardware FIR (ARM DMA throughput at 2.4 MSPS is ~40% of real-time).
sdr_timeout_multiplier=2
# Generate I/Q spectrogram, constellation, and PSD BMPs
sdr_enable_spectrogram=true
sdr_enable_constellation=true
sdr_enable_psd=true
# Delete capture.sc16 after all artifacts are generated (saves ~15 MB per 20s capture).
# Set to true to keep sc16 files for ground re-analysis.
sdr_keep_sc16=false
# Number of capture iterations per run
sdr_captures=6

# SDR init strategy: false = init once before capture loop (default),
# true = re-init AD9361 each capture (robust mode for recovery from bad state)
sdr_init_per_capture=false

# Hardware FIR decimation (AD9361 programmable FIR via libad9361)
# Decimates in hardware before DMA to reduce ARM processing load.
# When enabled, sdr_rate is the ADC rate and sdr_hw_fir_rate is the
# post-FIR rate entering GNU Radio. Adjust sdr_decimation accordingly.
sdr_hw_fir_enable=true
# Post-FIR baseband rate in Hz (600 kSPS)
sdr_hw_fir_rate=600000
# FIR passband edge in Hz (auto-default: rate/3)
sdr_hw_fir_fpass=200000
# FIR stopband edge in Hz (auto-default: Fpass*1.25)
sdr_hw_fir_fstop=250000
# TX analog filter bandwidth in Hz (auto-default: 1.6*Fstop)
sdr_hw_fir_wnom_tx=400000
# RX analog filter bandwidth in Hz (auto-default: 1.4*Fstop)
sdr_hw_fir_wnom_rx=350000
