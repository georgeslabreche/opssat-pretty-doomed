# PRETTY DOOMed Pipeline Configuration

# Signal Processing
lowpass_cutoff=3400
bandpass_low=300
bandpass_high=3400
lowpass_transition=500
bandpass_transition=100

# Speech-to-Text
model_encoder=models/sherpa-onnx/small/encoder-epoch-99-avg-1.int8.onnx
model_decoder=models/sherpa-onnx/small/decoder-epoch-99-avg-1.onnx
model_joiner=models/sherpa-onnx/small/joiner-epoch-99-avg-1.int8.onnx
model_tokens=models/sherpa-onnx/small/tokens.txt
decoding_method=modified_beam_search
num_threads=1

# Detection
wake_word=PRETTY
call_signs=NIGHT,LIGHT,HEART,POWER,HORSE,HOUSE,DARK,WORLD,COUNT,WONDER,PRINCE,FRIEND,OPEN,ALPHA,BRAVO,CHARLIE,DELTA,ECHO,FOXTROT,GOLF,HOTEL,INDIA,JULIET,KILO,LIMA,MIKE,NOVEMBER,OSCAR,PAPA,ROMEO,SIERRA,TANGO,UNIFORM,VICTOR,WHISKEY,YANKEE,ZULU
command=DOOM,PLAY DOOM
fuzzy_max_distance=1

# DOOM Frame Capture
# Per-demo frame specs: doom_frames_<demo>=<spec>
#   Individual frame numbers produce JPEGs, dash ranges produce animated GIFs.
#   -1 = random frame each run (requires doom_maxframes_<demo>)
#   Comma-separated integers (no dashes) = cycle through across runs
doom_frames_e1m7-607=8000,7992-8025
doom_frames_impfight=-1
doom_frames_m1-fast=400,300,500,100
doom_frames_m1-normal=-1
doom_frames_m1-simple=-1
doom_keepgifframes=false

# Max frame counts per demo (time * 35fps, for random frame selection)
doom_maxframes_impfight=2030
doom_maxframes_m1-normal=1785
doom_maxframes_m1-simple=700
