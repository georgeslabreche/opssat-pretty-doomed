# What ./run runs (#142). Environment variables override these values:
# DISTRESS_MODELS and DISTRESS_CLIP_NAMES.

# Configs to run, in order, comma-separated: config.distress.<name>.cfg.
# Empty: all five.
models=zipformer-small-int8,parakeet-110m-int8,parakeet-0.6b-v2-int8-w5,parakeet-0.6b-v2-int8,parakeet-0.6b-v2-int8-t2

# Clips to run, by name, comma-separated (clips/<name>.wav).
# Empty: all 13 clips.
# The value below is the first test: the two shortest clips, 4.0 s and 4.3 s,
# which every model detects on the ground. It shows in minutes that each
# config loads, runs, detects, writes its report cards, and fits in memory,
# with more than one clip per config. For the full run, leave clips= empty.
clips=37977-bainbridge-skiff,56367-netarts-pwc
