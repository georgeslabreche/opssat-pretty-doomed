# Distress call evaluation on the EM (#142): Zipformer small int8, the flight model.
# The model files are the files of the v8 install.
stt_model_encoder=models/sherpa-onnx/small/encoder-epoch-99-avg-1.int8.onnx
stt_model_decoder=models/sherpa-onnx/small/decoder-epoch-99-avg-1.onnx
stt_model_joiner=models/sherpa-onnx/small/joiner-epoch-99-avg-1.int8.onnx
stt_model_tokens=models/sherpa-onnx/small/tokens.txt
stt_decoding_method=modified_beam_search

# Detection only: a detection is logged and scored, and DOOM does not launch.
operation=detect
process_mode=sequential
stt_num_threads=1
stt_window_s=10

# Distress phrases: tools/distress/phrases.txt, plus "MAY DAY" for a split
# mayday. The ground scorer (tools/distress/score.py) gives the evaluation
# results. These on-board detection scores are for information only.
detect_wake_word=MAYDAY
detect_call_signs=
detect_command=MAYDAY,MAY DAY,PAN PAN,SOS,S O S,FIRE,EXPLOSION,FLOODING,COLLISION,AGROUND,GROUNDED,LISTING,CAPSIZE,CAPSIZED,CAPSIZING,SINKING,ADRIFT,ABANDON SHIP,ABANDONING SHIP,MAN OVERBOARD,PERSON OVERBOARD,TAKING ON WATER,GOING DOWN,HELP
detect_fuzzy_max_distance=1
detect_strip_punctuation=true
