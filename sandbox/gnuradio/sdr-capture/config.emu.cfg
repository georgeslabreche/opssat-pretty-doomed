# SDR emulator config
# Matches emulator sample: 38.4 MSPS, 2 RX channels, GPS L5 @ 1176.45 MHz
#
# Usage:
#   docker-compose -f docker-compose.emu-test.yml up -d sdr-emu
#   docker-compose -f docker-compose.emu-test.yml run --rm sdr-capture \
#     sh -c "cp build/capture_loop . && ./capture_loop \
#       --config config.emu.cfg --output toGround/emu-test.wav \
#       --duration 5 --no-readback"

# SDR hardware (match emulator sample file parameters)
frequency=1176450000
sdr_rate=38400000
decimation=192
rf_bandwidth=38400000
gain=50
fm_deviation=5000
uri=ip:sdr-emu:30431
rx_channels=2

# Capture
duration=5
captures=1
max_iq_mb=20

# Audio
audio_rate=16000
bandpass_low=300
bandpass_high=3400

# LPF (channelization before I/Q storage)
lpf_cutoff=85000
lpf_transition=15000
