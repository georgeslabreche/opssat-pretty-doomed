# SDR hardware
frequency=1296000000
sdr_rate=2400000
decimation=12
rf_bandwidth=200000
gain=50
fm_deviation=5000
uri=local:

# Capture
duration=20
captures=30
max_iq_mb=20

# Audio
audio_rate=16000
bandpass_low=300
bandpass_high=3400

# LPF (channelization before I/Q storage)
lpf_cutoff=85000
lpf_transition=15000

# Emulator: uncomment the two lines below for emulator testing
# uri=ip:sdr-emu:30431
# min_readback=true
