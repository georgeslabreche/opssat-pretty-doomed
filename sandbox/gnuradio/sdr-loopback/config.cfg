# SDR hardware
frequency=1296000000
sdr_rate=2400000
decimation=12
rf_bandwidth=200000
gain=50
tx_attenuation=10.0
fm_deviation=5000
uri=local:

# Downlink budget
max_iq_mb=20

# Audio
audio_rate=16000
bandpass_low=300
bandpass_high=3400

# LPF
lpf_cutoff=85000
lpf_transition=15000

# Readback tolerance: max Hz offset for sample rate before fatal (AD9361 PLL quantization)
rate_tolerance=10

# Timeout: multiplier for audio duration (timeout = duration * N + 10 seconds)
# Default 5 provides headroom for slow ARM CPUs (EM runs RX at ~40-80k SPS vs 200k expected)
timeout_multiplier=5

# IIO DMA buffer size (samples per channel, default 32768 = 0x8000)
# Smaller buffers reduce DMA bandwidth per transfer, larger buffers add tolerance
# iio_buffer_size=32768

# Diagnostics: pin all threads to CPU 0
single_core=false

# Emulator: uncomment the two lines below for emulator testing
# uri=ip:sdr-emu:30431
# min_readback=true

# File loopback: bypass IIO hardware, test DSP chain with file I/O
# loopback_file: temporary file written by TX flowgraph and read by RX flowgraph
# (created and deleted during the test, does not need to exist beforehand)
# use_file_loopback=true
# loopback_file=loopback_iq.raw

# Feature flags: toggle flowgraph blocks for isolation testing (all enabled by default)
# Set to false to disable individual blocks and identify where the signal chain breaks
# enable_tx=true
# enable_fm_mod=true
# enable_fm_demod=true
# enable_lpf=true
# enable_resampler_tx=true
# enable_resampler_rx=true
# enable_bandpass=true

# TX execution mode: controls how TX interacts with RX streaming
#   default   — TX and RX start simultaneously
#   staggered — prepend silence to TX audio so RX streams first (tests startup race)
#   cyclic    — TX loops a single DMA buffer (no continuous CPU refill, tests DMA contention)
# tx_mode=default
# tx_startup_delay=2

# Plot generation: toggle onboard BMP plot outputs (both enabled by default)
# enable_spectrogram=true
# enable_constellation=true
