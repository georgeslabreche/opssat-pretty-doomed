# SDR emulator config — same experiment as config.cfg, targeting the emulator
# Only uri and min_readback differ from config.cfg
#
# The emulator accepts parameter writes but does not update sampling_frequency
# readback, so min_readback=true downgrades the sample rate check to a warning.

# SDR hardware
frequency=1296000000
sdr_rate=2400000
decimation=12
rf_bandwidth=200000
gain=50
tx_attenuation=10.0
fm_deviation=5000
uri=ip:sdr-emu:30431
min_readback=true

# Downlink budget
max_iq_mb=20

# Audio
audio_rate=16000
bandpass_low=300
bandpass_high=3400

# LPF
lpf_cutoff=85000
lpf_transition=15000
