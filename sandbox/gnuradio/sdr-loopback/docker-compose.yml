services:
  sdr-loopback:
    build: .
    container_name: gnuradio-sdr-loopback
    volumes:
      - ./src:/app/src
      - ../../../common:/app/common
      - ./Makefile:/app/Makefile
      - ./build:/app/build
      - ./package:/app/package
      - ./run:/app/run
      - ./config.cfg:/app/config.cfg
      - ./toGround:/app/toGround
      - ../../../samples:/app/samples
    working_dir: /app
    tty: true
