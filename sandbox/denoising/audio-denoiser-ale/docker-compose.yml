services:
  ale-denoiser:
    build: .
    container_name: ale-denoiser
    volumes:
      - ./src:/app/src
      - ./Makefile:/app/Makefile
      - ./batch_validate_ale.sh:/app/batch_validate_ale.sh
      - ./output:/app/output
      - ../../samples:/app/samples
    working_dir: /app
    tty: true
