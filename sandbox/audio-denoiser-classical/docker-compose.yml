services:
  classical-denoiser:
    build: .
    container_name: classical-denoiser
    volumes:
      - ./src:/app/src
      - ./Makefile:/app/Makefile
      - ./batch_validate_spectral_subtraction.sh:/app/batch_validate_spectral_subtraction.sh
      - ./batch_validate_adaptive.sh:/app/batch_validate_adaptive.sh
      - ./output:/app/output
      - ../../samples:/app/samples
    working_dir: /app
    tty: true
